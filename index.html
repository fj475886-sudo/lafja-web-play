<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<script>
// web.lafja.com.br abre sem cadeado: as listas mandam vídeo em http, que o navegador bloqueia numa página https.
if (location.protocol === 'https:' && location.hostname === 'web.lafja.com.br') location.replace('http://' + location.host + location.pathname + location.search + location.hash);
</script>
<title>Lafja Play</title>
<!-- iPhone/Android: "Adicionar à Tela de Início" abre como app, com o ícone da marca e sem a barra do navegador -->
<link rel="apple-touch-icon" href="icon-130.png">
<link rel="icon" href="icon-80.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lafja Play">
<meta name="theme-color" content="#0A0A0C">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="browser.css">
</head>
<body>
<button id="web-menu" type="button" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button>
<nav id="web-controls" aria-label="Navegação do aplicativo">
  <button id="web-back" type="button">← Voltar</button>
  <button id="web-home" type="button">Início</button>
  <button id="web-model" type="button" title="Escolher o modelo de tela">Telas</button>
  <span></span>
  <button id="web-fullscreen" type="button">Tela cheia</button>
</nav>
<div id="web-rotate" aria-live="polite">
  <img src="marca-logo.png" alt="Lafja Play">
  <div class="web-rotate-phone"><i></i></div>
  <p>Deite o celular para usar o app</p>
  <small>Se a tela não girar, desligue o bloqueio de rotação (no iPhone: Central de Controle, ícone do cadeado com a seta).</small>
</div>
<div id="web-stage">
<div id="app"><div class="screen splash" id="boot-splash">
  <img class="splash-logo" src="marca-logo.png" alt="Lafja Play">
  <p class="splash-status">Abrindo…</p>
  <div class="splash-progress"><i></i></div>
</div></div>
<div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
